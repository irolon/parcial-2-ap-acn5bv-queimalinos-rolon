name: CI

on:
  pull_request:
  push:
    branches: [develop]

# El CI solo lee el repo: no comenta, no pushea ni publica nada.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + unitarios, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 20 = el mínimo que declara `engines` en backend/package.json; 22 = .nvmrc y el Dockerfile.
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --maxWorkers=2 --testTimeout=15000
      - run: npm run build
